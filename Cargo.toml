# This manifest builds the Diff plugin as a WebAssembly component guest; the parser
# and the sheet builder are plain Rust, so `cargo test` runs them on the host.
[package]
name = "pigeon-diff"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
